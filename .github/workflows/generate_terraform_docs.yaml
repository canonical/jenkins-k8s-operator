name: Generate Terraform docs

on:
  push:
    branches:
      - main
    paths:
      - '**/terraform/**'
      - '.github/workflows/generate_terraform_docs.yaml'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-terraform-docs:
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1 # main
    permissions:
      contents: write
      pull-requests: write
    with:
      terraform-directory: 'terraform/charm,terraform/product'
    secrets: inherit
