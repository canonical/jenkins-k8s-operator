project: jenkins-k8s-operator
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test:
    type: integration-test
    systems:
    - ubuntu-24.04
    # The integration tests run on the k8s model. LXD remains available for
    # the machine-agent model used by the cross-model tests.
    prepare: |
      snap install charmcraft --classic
      sudo -u ubuntu -H juju switch concierge-k8s:testing
    # Spread runs backend debug-each immediately after a task fails. Keep
    # this focused on the ephemeral Juju model and workload state that the
    # outer workflow cannot inspect after the spread task has returned.
    debug-each: |
      set +e
      echo "=== targeted Juju failure diagnostics ==="
      sudo -u ubuntu bash <<'DIAGNOSTICS'
      set +e
      mapfile -t models < <(juju models --format json | jq -r '.models[]."short-name"' 2>/dev/null)
      for model in "${models[@]}"; do
        echo "=== model: $model ==="
        juju status -m "$model" --relations --storage --color=false || true
        status_json="$(juju status -m "$model" --format json --color=false 2>/dev/null || true)"
        echo "$status_json" | jq -r '.applications | to_entries[] | "app=" + .key + " status=" + (.value["application-status"].current // "unknown") + " message=" + (.value["application-status"].message // "")' || true
        while IFS= read -r unit; do
          [ -z "$unit" ] && continue
          echo "=== unit: $unit ==="
          juju show-unit -m "$model" "$unit" || true
          # Sidecar workload state is not included in juju show-unit. Query
          # Pebble through the charm container without printing the plan.
          juju ssh -m "$model" "$unit" \
            PEBBLE_SOCKET=/charm/containers/jenkins/pebble.socket \
            /charm/bin/pebble services || true
        done < <(echo "$status_json" | jq -r '.applications | to_entries[] | .value.units // {} | keys[]' 2>/dev/null)
        while IFS= read -r app; do
          [ -z "$app" ] && continue
          echo "=== recent Juju log: $app ==="
          juju debug-log -m "$model" --include "$app" --limit 120 || true
        done < <(echo "$status_json" | jq -r '.applications | keys[] | select(test("jenkins"))' 2>/dev/null)
        echo "=== Kubernetes workload summary: $model ==="
        sudo k8s kubectl get pods -n "$model" -o wide || true
        sudo k8s kubectl get events -n "$model" --sort-by=.lastTimestamp | tail -80 || true
        # Capture the workload boundary that explains a readiness failure. Keep
        # logs bounded and redact common credential-bearing fields.
        pod_names="$(sudo k8s kubectl get pods -n "$model" -o json 2>/dev/null \
          | jq -r '.items[] | select(.metadata.name | test("jenkins")) | .metadata.name' 2>/dev/null || true)"
        while IFS= read -r pod; do
          [ -z "$pod" ] && continue
          echo "=== pod description: $pod ==="
          sudo k8s kubectl describe pod -n "$model" "$pod" || true
          containers="$(sudo k8s kubectl get pod -n "$model" "$pod" -o json \
            | jq -r '.spec.containers[].name' 2>/dev/null || true)"
          while IFS= read -r container; do
            [ -z "$container" ] && continue
            echo "=== recent container log: $pod/$container ==="
            sudo k8s kubectl logs -n "$model" "$pod" -c "$container" \
              --since=15m --tail=300 2>/dev/null \
              | sed -E 's/((password|passwd|token|secret|authorization)[=:][[:space:]]*)[^[:space:]]+/\1<redacted>/Ig' \
              | tail -300 || true
          done <<< "$containers"
        done <<< "$pod_names"
      done

      # Machine-backed integration fixtures use a separate LXD controller and
      # model. Capture machine allocation and cross-model state when a unit is
      # pending or errored. Do not print machine environment or credentials.
      for controller in concierge-lxd; do
        echo "=== machine-controller: $controller ==="
        machine_models="$(juju models --controller "$controller" --format json 2>/dev/null \
          | jq -r '.models[]."short-name"' 2>/dev/null || true)"
        while IFS= read -r machine_model; do
          [ -z "$machine_model" ] && continue
          machine_status_json="$(juju status -m "$controller:$machine_model" --format json \
            --color=false 2>/dev/null || true)"
          machine_summary="$(echo "$machine_status_json" | jq -r \
            '.machines | to_entries[] | "machine=" + .key + " instance=" + (.value["instance-id"] // "") + " agent=" + (.value["agent-status"].current // "") + " agent_message=" + (.value["agent-status"].message // "")' \
            2>/dev/null || true)"
          unit_summary="$(echo "$machine_status_json" | jq -r \
            '.applications | to_entries[] | .value.units // {} | to_entries[] | "unit=" + .key + " machine=" + (.value.machine // "") + " workload=" + (.value["workload-status"].current // "") + " workload_message=" + (.value["workload-status"].message // "")' \
            2>/dev/null || true)"
          if [ -n "$machine_summary" ] || [ -n "$unit_summary" ]; then
            echo "=== machine-model: $controller:$machine_model ==="
            echo "$machine_summary"
            echo "$unit_summary"
            juju status -m "$controller:$machine_model" --relations --storage --color=false || true
            while IFS= read -r machine_id; do
              [ -z "$machine_id" ] && continue
              echo "=== machine-details: $controller:$machine_model machine=$machine_id ==="
              juju show-machine -m "$controller:$machine_model" "$machine_id" || true
              juju debug-log -m "$controller:$machine_model" \
                --include "machine-$machine_id" --limit 120 || true
            done < <(echo "$machine_status_json" | jq -r \
              '.machines | to_entries[] | select((.value["agent-status"].current // "") == "error" or (.value["agent-status"].message // "") | test("waiting|pending|failed"; "i")) | .key' \
              2>/dev/null || true)
          fi
        done <<< "$machine_models"
      done
      DIAGNOSTICS
environment:
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge-juju3.yaml}")'
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'
exclude:
- .git
- .tox
- .venv
- .*_cache

x-pytest-args: &pytest-args
  pytest-arguments-template: |
    --model testing
    --kube-config=/home/ubuntu/.kube/config
  pytest-environment-template: |
    SPREAD_JOB={{ env.get("SPREAD_JOB", "") }}

integration-suites:
  tests/integration/:
    <<: *pytest-args
    working-dir: ./
    summary: Canonical Kubernetes integration tests
    backends:
    - integration-test
