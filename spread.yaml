# Spread drives the charm-ci integration tests. opcli expands the virtual
# "integration-test" backend below into "integration-test-local" (LXD VM on a
# dev machine) or "integration-test-ci" (GitHub-hosted runner), then creates
# one spread task per integration test module in tests/integration/. Each task
# gets a fresh VM + model, provisioning Canonical Kubernetes via concierge.
project: jenkins-k8s-operator
# Project root inside the test VM; part of the charm-ci/opcli backend contract.
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test:
    type: integration-test
    systems:
    - ubuntu-24.04
    # The integration tests run on the k8s model. LXD remains available for
    # the machine-agent model used by the cross-model tests.
    prepare: |
      snap install charmcraft --classic
      sudo -u ubuntu -H juju switch concierge-k8s:testing
environment:
  # Concierge config used to provision the controllers (Juju 3 + CK8s + LXD).
  # Suites can override per module via "environment: CONCIERGE: <file>".
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge-juju3.yaml}")'
  # opcli version installed in the test VM. CI sets this to the workflow's
  # pinned charm-ci ref; local runs fall back to main.
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'
exclude:
- .git
- .tox
- .venv
- .*_cache

x-pytest-args: &pytest-args
  pytest-arguments-template: |
    --model testing
    --kube-config=/home/ubuntu/.kube/config
  pytest-environment-template: |
    SPREAD_JOB={{ env.get("SPREAD_JOB", "") }}

# Auto-discovers every test_*.py under tests/integration/ and runs it as its
# own spread job (one module per VM/model; see `opcli spread jobs` output).
integration-suites:
  tests/integration/:
    <<: *pytest-args
    working-dir: ./
    summary: Canonical Kubernetes integration tests
    backends:
    - integration-test
